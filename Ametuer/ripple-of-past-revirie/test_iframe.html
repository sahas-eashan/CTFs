<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-abc'; style-src 'nonce-abc'; img-src 'self'; font-src https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'none'; form-action 'self';">
<title>Test iframe sandbox</title>
<style nonce="abc">body{font-family:sans-serif;}</style>
</head>
<body>
<iframe sandbox="allow-scripts allow-same-origin" srcdoc="&lt;script&gt;parent.window.pwned = 1;&lt;/script&gt;"></iframe>
<p>pwned? <span id="status"></span></p>
<script nonce="abc">
setTimeout(()=>{
  document.getElementById('status').textContent = window.pwned;
},1000);
</script>
</body>
</html>
